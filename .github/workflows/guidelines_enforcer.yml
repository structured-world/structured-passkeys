name: Ledger guidelines

# Ledger's guidelines enforcer, required for the Ledger catalog: manifest, icons,
# load parameters, README and SDK version.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  guidelines_enforcer:
    name: Ledger guidelines enforcer
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_guidelines_enforcer.yml@8250648d7eed5f825c8e7441f6d064931e30efec # v1
