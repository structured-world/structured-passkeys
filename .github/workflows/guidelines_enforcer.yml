name: Ledger guidelines

# Ledger's guidelines enforcer, required for the Ledger catalog: manifest, icons,
# load parameters, README and SDK version.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  guidelines_enforcer:
    name: Ledger guidelines enforcer
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_guidelines_enforcer.yml@82f0632b902f0c10fd34deb70cd7cd15ed28ae81 # v1
