name: Ledger build

# Ledger's reusable build, the build Ledger deploys from, for every device in
# ledger_app.toml.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  build:
    name: Build for every device
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@8250648d7eed5f825c8e7441f6d064931e30efec # v1
    with:
      upload_app_binaries_artifact: structured_passkeys_binaries
      builder: ledger-app-builder
      # Pull requests also build the target branch and get a comment with the ELF section and
      # stack sizes per device against it. Not for pull requests from forks or from Dependabot:
      # GitHub gives them a read-only token, and the reusable workflow puts the table only into
      # that comment, so the target branch builds would produce nothing anyone sees.
      build_comparison: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
