name: Check

# The repository's gate script, the same one local runs use.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          # shellcheck and cargo-fuzz pinned: their verdicts change between releases, and the
          # gate must judge the same way here and on a workstation. The fuzz targets' dated
          # nightly is installed by scripts/fuzz.sh itself.
          tool: cargo-nextest,cargo-fuzz@0.13.2,lychee,shellcheck@0.11.0
      # The fuzz corpus is generated by the gate and never committed; the cache carries it from
      # run to run, so each run goes on from where the last one stopped.
      - name: Fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/ctap/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # Pinned for the same reason; install-action does not carry actionlint, so the release
      # archive is fetched and checked against its published SHA-256.
      - name: actionlint 1.7.12
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl -sSfL --proto '=https' --proto-redir '=https' -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/${archive}" \
            | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" actionlint
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Gate
        run: scripts/check.sh
