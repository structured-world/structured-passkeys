# Device builds run from this directory in the Ledger dev-tools image.

[build]
# The SDK build script resolves icon paths against the parent of the target directory and
# Ledger's checks resolve them against this directory, so the target directory lives here.
target-dir = "target"

[env]
# The C SDK's IO buffer, where an NFC APDU is assembled, holds 272 bytes by default; an extended
# APDU carrying a 1024-byte CTAP request needs COMM_SIZE in src/main.rs.
LEDGER_SDK_EXTRA_DEFINES = "CUSTOM_IO_APDU_BUFFER_SIZE=1040"

[profile.release]
opt-level = "z"
lto = true

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]
