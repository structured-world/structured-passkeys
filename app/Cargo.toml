[package]
name = "structured-passkeys-app"
description = "FIDO2 / passkey authenticator application for Ledger devices"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The published crate (1.41.0) plus what it does not have yet: `app_io_stack` runs the IO stack in
# the application, so the application can drive the FIDO HID interface itself,
# `Comm::next_command_or_event` hands it the ticker events its transport clock needs, and `nfc`
# builds the NFC card emulation whose APDUs reach the application with their transport and Le;
# they come from this fork of the Ledger Rust SDK until the published crate has them.
# `sys` exposes the C SDK calls the application makes directly: the NBGL use cases its screens
# start without the SDK's blocking wait, and whether the device is unlocked.
ledger_device_sdk = { git = "https://github.com/structured-world/ledger-device-rust-sdk", rev = "3d8a39f27375d7e73b19d3df13fa96b0ac9ba3f1", features = ["io_new", "nano_nbgl", "app_io_stack", "nfc", "sys"] }
structured-passkeys-ctap = { path = "../crates/ctap", default-features = false }
zeroize = { version = "1.9.0", default-features = false }

# Read by the SDK build script into the install parameters of the binary. Icon paths are
# relative to this directory.
[package.metadata.ledger]
name = "Structured Passkeys"
curve = ["secp256r1"]
# No application flags of its own: built-in user verification is the device unlock, which needs
# none. The SDK adds APPLICATION_FLAG_BOLOS_SETTINGS on the devices with Bluetooth or NFC, which the
# NFC stack needs to read whether NFC is enabled.
flags = "0"
path = ["5722689'/5262163'"]
nanosplus = { icon = "icons/key_14x14.png" }
nanox = { icon = "icons/key_14x14.png" }
stax = { icon = "icons/key_32x32.png" }
flex = { icon = "icons/key_40x40.png" }
apex_p = { icon = "icons/key_32x32.png" }

[lints]
workspace = true
