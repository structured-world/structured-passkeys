[package]
name = "structured-passkeys-ctap-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# cargo-fuzz builds with nightly and its own flags, so the fuzz crate is a workspace of its own.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
structured-passkeys-ctap = { path = "..", features = ["soft"] }

[[bin]]
name = "ctaphid"
path = "fuzz_targets/ctaphid.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cbor"
path = "fuzz_targets/cbor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "credential-id"
path = "fuzz_targets/credential_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ctap2"
path = "fuzz_targets/ctap2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nfc"
path = "fuzz_targets/nfc.rs"
test = false
doc = false
bench = false
